<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bordeaux Components</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Cormorant+Garamond:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&family=Noto+Naskh+Arabic:wght@400..700&display=swap" rel="stylesheet">
<style>
/* ---------- Bordeaux tokens ---------- */
.z { --bg:#F8F4F1; --sunken:#F0EAE6; --surface:#FDFBFA; --line:rgba(60,16,24,.10); --line-strong:rgba(60,16,24,.18); --fg:#1E1215; --muted:#6F6064; --faint:#A6989B;
  --primary:#6B1B2A; --primary-hover:#58141F; --pfg:#FBF6F3; --accent:#C9A27A; --accent-text:#7A2233; --chart:#7A2233;
  --ok:#3E6E52; --info:#2F5E86; --warn:#9C6B1E; --bad:#C0421F;
  --side-bg:#4A1320; --side-fg:#F6ECE8; --side-muted:#C49CA3; --side-active:rgba(255,255,255,.09); --side-line:rgba(255,255,255,.10);
  --shadow:0 1px 0 rgba(60,16,24,.03), 0 18px 40px -28px rgba(60,16,24,.30); --overlay:rgba(30,18,21,.38); --chip:#EFE5E2; --ring:#C9A27A;
  --ui:'Geist','IBM Plex Sans Arabic',sans-serif; --display:'Cormorant Garamond','Noto Naskh Arabic',serif; }
.z.dark { --bg:#0E0A0B; --sunken:#150F11; --surface:#181214; --line:rgba(245,225,228,.09); --line-strong:rgba(245,225,228,.16); --fg:#F1E9E7; --muted:#A8989B; --faint:#6A5C5F;
  --primary:#9E2F45; --primary-hover:#B03750; --pfg:#FFF4F1; --accent:#D2AE86; --accent-text:#D9B892; --chart:#C75A6E;
  --ok:#8DC3A1; --info:#8DB5DC; --warn:#DDB46E; --bad:#F08A70;
  --side-bg:#140C0E; --side-fg:#F1E9E7; --side-muted:#8F7C80; --side-active:rgba(255,255,255,.05); --side-line:rgba(255,255,255,.06);
  --shadow:0 24px 48px -28px rgba(0,0,0,.9); --overlay:rgba(0,0,0,.6); --chip:#231A1C; --ring:#D2AE86; }

* { box-sizing:border-box; }
body { margin:0; font:14px/1.55 Geist, system-ui, sans-serif; -webkit-font-smoothing:antialiased; background:#e9e5e2; }
body.dk { background:#070506; }
.z { background:var(--bg); color:var(--fg); font-family:var(--ui); font-size:13px; }
.z[dir=rtl] { line-height:1.7; }
svg.i { width:16px; height:16px; flex:none; fill:none; stroke:currentColor; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; }
[dir=rtl] .flip { transform:scaleX(-1); }

/* ---------- presentation chrome ---------- */
.toolbar { position:sticky; top:0; z-index:50; display:flex; flex-wrap:wrap; gap:12px 24px; align-items:center; padding:14px 24px; background:rgba(20,10,13,.92); color:#f1e9e7; backdrop-filter:blur(10px); font-size:13px; }
.toolbar b { font-family:'Cormorant Garamond',serif; font-size:22px; font-weight:500; margin-inline-end:auto; }
.tg { display:inline-flex; padding:3px; border:1px solid rgba(255,255,255,.15); border-radius:999px; }
.tg button { font:inherit; border:0; background:none; color:#b9a9ac; padding:5px 14px; border-radius:999px; cursor:pointer; }
.tg button.on { background:#f1e9e7; color:#1e1215; }
.stage { max-width:1320px; margin:0 auto; padding:28px 16px 96px; }
.sec { margin:0 0 56px; }
.sec-h { display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; margin:0 0 14px; color:#5b4a4e; }
body.dk .sec-h { color:#a8989b; }
.sec-h h2 { margin:0; font-family:'Cormorant Garamond',serif; font-weight:500; font-size:28px; color:#1e1215; }
body.dk .sec-h h2 { color:#f1e9e7; }
.sec-h code { font-size:12px; background:rgba(107,27,42,.08); color:#7a2233; padding:2px 7px; border-radius:4px; }
body.dk .sec-h code { background:rgba(210,174,134,.1); color:#d9b892; }
.frame { border-radius:14px; overflow:hidden; border:1px solid var(--line); box-shadow:0 40px 80px -50px rgba(0,0,0,.5); }

/* ---------- shell ---------- */
.shell { display:flex; min-height:760px; }
.side { width:252px; flex:none; background:var(--side-bg); color:var(--side-fg); border-inline-end:1px solid var(--side-line); padding:18px 12px 12px; display:flex; flex-direction:column; }
.brand { display:flex; gap:11px; align-items:center; padding:2px 8px 16px; }
.mark { width:32px; height:32px; border-radius:4px; display:grid; place-items:center; font-family:var(--display); font-size:16px; border:1px solid var(--side-line); color:var(--accent); }
.brand b { display:block; font-weight:600; font-size:13.5px; line-height:1.2; } .brand small { color:var(--side-muted); font-size:11.5px; }
.brand .sw { margin-inline-start:auto; color:var(--side-muted); }
.grp { display:flex; align-items:center; justify-content:space-between; font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--side-muted); padding:14px 10px 6px; }
.grp .i { width:12px; height:12px; }
.it { position:relative; display:flex; align-items:center; gap:11px; padding:6.5px 10px; border-radius:4px; opacity:.74; }
.it.on { background:var(--side-active); opacity:1; }
.it.on::before { content:''; position:absolute; inset-inline-start:-12px; top:8px; bottom:8px; width:2px; border-radius:2px; background:var(--accent); }
.it .end { margin-inline-start:auto; opacity:.7; }
.sub { margin:2px 0 4px; padding-inline-start:37px; border-inline-start:0; }
.sub div { padding:5px 10px; border-radius:4px; opacity:.66; font-size:12.5px; position:relative; }
.sub div::before { content:''; position:absolute; inset-inline-start:-14px; top:0; bottom:0; width:1px; background:var(--side-line); }
.sub div.on { opacity:1; }
.side-foot { margin-top:auto; border-top:1px solid var(--side-line); padding-top:10px; }
.me { display:flex; gap:10px; align-items:center; padding:8px; } .me small { display:block; color:var(--side-muted); font-size:11px; }
.av { width:30px; height:30px; flex:none; border-radius:50%; display:grid; place-items:center; font-size:10.5px; font-weight:600; background:var(--chip); color:var(--fg); }
.side .av { background:var(--side-active); color:var(--side-fg); border:1px solid var(--side-line); }
.main { flex:1; min-width:0; display:flex; flex-direction:column; }
.bar { height:58px; display:flex; align-items:center; gap:12px; padding:0 30px; border-bottom:1px solid var(--line); }
.crumb { color:var(--muted); font-size:12.5px; display:flex; align-items:center; gap:6px; } .crumb b { color:var(--fg); font-weight:500; } .crumb .i { width:12px; height:12px; opacity:.5; }
.cmdk { margin-inline-start:auto; display:flex; align-items:center; gap:9px; height:34px; width:300px; padding:0 12px; border-radius:4px; background:var(--sunken); border:1px solid var(--line); color:var(--faint); font-size:12.5px; }
kbd { font:inherit; font-size:10.5px; border:1px solid var(--line); border-radius:3px; padding:0 6px; color:var(--muted); background:var(--surface); }
.cmdk kbd { margin-inline-start:auto; }
.ib { position:relative; width:34px; height:34px; display:grid; place-items:center; border-radius:50%; color:var(--muted); }
.ib i { position:absolute; top:8px; inset-inline-end:9px; width:6px; height:6px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 2px var(--bg); }
.content { padding:34px 30px 30px; display:flex; flex-direction:column; gap:24px; }

/* ---------- page header / stat tiles ---------- */
.ph { display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap; }
.eyebrow { font-size:10.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--accent-text); }
.ph h1 { font-family:var(--display); font-weight:500; font-size:44px; letter-spacing:-.01em; line-height:1.05; margin:8px 0 6px; }
.ph p { margin:0; color:var(--muted); max-width:560px; }
.acts { display:flex; gap:8px; flex-wrap:wrap; }
.stats { display:grid; grid-template-columns:repeat(4,1fr); border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
.stat { padding:20px 24px 18px; border-inline-start:1px solid var(--line); }
.stat:first-child { border-inline-start:0; padding-inline-start:0; }
.lbl { font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }
.fig { font-family:var(--display); font-weight:500; font-size:38px; letter-spacing:-.02em; line-height:1; margin:12px 0 9px; font-variant-numeric:lining-nums tabular-nums; white-space:nowrap; }
.fig .pre { font-family:var(--ui); font-size:11px; letter-spacing:.12em; color:var(--muted); margin-inline-end:6px; vertical-align:.9em; }
.fig small { font-size:.5em; color:var(--muted); margin-inline-start:2px; }
.foot { display:flex; justify-content:space-between; align-items:center; font-size:11.5px; }
.up { color:var(--ok); } .dn { color:var(--bad); } .mut { color:var(--muted); }

/* ---------- buttons & inputs ---------- */
.btn { height:36px; padding:0 16px; border-radius:3px; font:inherit; font-size:12.5px; font-weight:500; letter-spacing:.01em; border:1px solid var(--line-strong); background:var(--surface); color:var(--fg); display:inline-flex; align-items:center; gap:7px; white-space:nowrap; cursor:pointer; }
.btn .i { width:14px; height:14px; }
.btn.p { background:var(--primary); color:var(--pfg); border-color:transparent; box-shadow:inset 0 1px 0 rgba(255,255,255,.08); }
.btn.p:hover { background:var(--primary-hover); }
.btn.g { background:transparent; border-color:transparent; }
.btn.d { background:transparent; color:var(--bad); border-color:color-mix(in srgb, var(--bad) 40%, transparent); }
.btn.dd { background:var(--bad); color:#fff; border-color:transparent; }
.btn.l { background:none; border:0; padding:0; height:auto; color:var(--accent-text); text-decoration:underline; text-underline-offset:3px; text-decoration-color:color-mix(in srgb, var(--accent-text) 35%, transparent); }
.btn.sm { height:30px; padding:0 12px; font-size:12px; }
.btn.lg { height:44px; padding:0 22px; font-size:13.5px; }
.btn.ic { width:36px; padding:0; justify-content:center; }
.btn[disabled] { opacity:.45; cursor:not-allowed; }
.btn.focus { outline:2px solid var(--ring); outline-offset:2px; }
.field { display:flex; flex-direction:column; gap:6px; }
.field label { font-size:12px; font-weight:500; }
.field label em { font-style:normal; color:var(--faint); font-weight:400; }
.help { font-size:11.5px; color:var(--muted); }
.err { font-size:11.5px; color:var(--bad); display:flex; gap:6px; align-items:center; }
.err .i { width:13px; height:13px; }
.in { height:38px; display:flex; align-items:center; gap:8px; padding:0 12px; border-radius:3px; border:1px solid var(--line-strong); background:var(--surface); color:var(--fg); font-size:13px; }
.in.ph-t { color:var(--faint); }
.in .aff { color:var(--muted); font-size:11px; letter-spacing:.1em; padding-inline-end:10px; border-inline-end:1px solid var(--line); height:100%; display:flex; align-items:center; }
.in .end { margin-inline-start:auto; color:var(--muted); }
.in.bad { border-color:var(--bad); box-shadow:0 0 0 3px color-mix(in srgb, var(--bad) 14%, transparent); }
.in.focus { border-color:var(--primary); box-shadow:0 0 0 3px color-mix(in srgb, var(--ring) 35%, transparent); }
.dark .in.focus { border-color:var(--accent); }
.ta { height:84px; align-items:flex-start; padding-top:10px; }
.seg { display:inline-flex; padding:3px; border-radius:4px; background:var(--sunken); border:1px solid var(--line); font-size:12px; }
.seg span { padding:5px 13px; border-radius:3px; color:var(--muted); }
.seg span.on { background:var(--surface); color:var(--fg); box-shadow:0 1px 2px rgba(0,0,0,.1); }
.switch { display:flex; gap:12px; align-items:flex-start; }
.sw-t { width:34px; height:20px; border-radius:999px; background:var(--primary); position:relative; flex:none; margin-top:1px; }
.sw-t::after { content:''; position:absolute; top:2px; inset-inline-end:2px; width:16px; height:16px; border-radius:50%; background:var(--pfg); }
.check { width:16px; height:16px; border-radius:3px; border:1px solid var(--line-strong); display:inline-grid; place-items:center; background:var(--surface); vertical-align:middle; }
.check.on { background:var(--primary); border-color:transparent; color:var(--pfg); }
.check .i { width:11px; height:11px; stroke-width:2.2; }

/* ---------- filter bar & table ---------- */
.panel { background:var(--surface); border:1px solid var(--line); border-radius:6px; box-shadow:var(--shadow); }
.fbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:14px 18px; border-bottom:1px solid var(--line); }
.fbar .in { height:34px; width:280px; background:var(--sunken); border-color:var(--line); }
.chip { height:30px; display:inline-flex; align-items:center; gap:7px; padding:0 11px; border-radius:999px; border:1px solid var(--line-strong); font-size:12px; color:var(--fg); }
.chip.dash { border-style:dashed; color:var(--muted); }
.chip b { font-weight:500; color:var(--accent-text); }
.chip .i { width:12px; height:12px; opacity:.6; }
.fbar .cnt { margin-inline-start:auto; color:var(--muted); font-size:12px; }
table { width:100%; border-collapse:collapse; }
th { position:sticky; top:0; background:var(--surface); font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); font-weight:500; text-align:start; padding:12px 14px; border-bottom:1px solid var(--line); white-space:nowrap; }
th.sorted { color:var(--fg); } th .i { width:11px; height:11px; vertical-align:-1px; margin-inline-start:4px; }
td { padding:13px 14px; border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums; vertical-align:middle; }
th:first-child, td:first-child { padding-inline-start:18px; width:34px; } th:last-child, td:last-child { padding-inline-end:18px; }
tbody tr:hover td { background:color-mix(in srgb, var(--primary) 3.5%, transparent); }
tr.sel td { background:color-mix(in srgb, var(--accent) 9%, transparent); }
.num { text-align:end; }
.ref { font-weight:500; letter-spacing:.02em; }
.who { display:flex; align-items:center; gap:10px; }
.sub2 { display:block; color:var(--muted); font-size:11.5px; }
.st { display:inline-flex; align-items:center; gap:8px; font-size:12px; white-space:nowrap; }
.st i { width:6px; height:6px; border-radius:50%; }
.st.void { color:var(--faint); text-decoration:line-through; }
.pag { display:flex; justify-content:space-between; align-items:center; padding:12px 18px; font-size:12px; color:var(--muted); flex-wrap:wrap; gap:10px; }
.pages { display:flex; gap:4px; align-items:center; }
.pages span { min-width:30px; height:30px; display:grid; place-items:center; border-radius:3px; }
.pages span.on { background:var(--fg); color:var(--bg); }
.legend { display:flex; flex-wrap:wrap; gap:10px 26px; padding:18px 22px; }

/* ---------- detail ---------- */
.dh { display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap; }
.dh h1 { font-family:var(--display); font-weight:500; font-size:44px; line-height:1.05; margin:8px 0 0; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
.dh h1 .st { font-family:var(--ui); font-size:12.5px; padding:4px 11px; border-radius:999px; border:1px solid color-mix(in srgb, var(--bad) 35%, transparent); color:var(--bad); }
.facts { display:grid; grid-template-columns:repeat(6,1fr); border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
.facts div { padding:16px 18px; border-inline-start:1px solid var(--line); }
.facts div:first-child { border-inline-start:0; padding-inline-start:0; }
.facts b { display:block; font-weight:500; margin-top:6px; font-variant-numeric:tabular-nums; }
.facts b.big { font-family:var(--display); font-size:24px; line-height:1.1; }
.tabs { display:flex; gap:26px; border-bottom:1px solid var(--line); }
.tabs span { padding:0 0 12px; color:var(--muted); position:relative; }
.tabs span.on { color:var(--fg); font-weight:500; }
.tabs span.on::after { content:''; position:absolute; inset-inline:0; bottom:-1px; height:2px; background:var(--primary); }
.dark .tabs span.on::after { background:var(--accent); }
.tabs em { font-style:normal; font-size:11px; color:var(--faint); margin-inline-start:5px; }
.dgrid { display:grid; grid-template-columns:1.7fr 1fr; gap:20px; }
.ph2 { display:flex; justify-content:space-between; align-items:center; padding:18px 22px 6px; }
.ph2 h3 { margin:0; font-family:var(--display); font-weight:500; font-size:22px; }
.totals { margin-inline-start:auto; width:280px; padding:12px 22px 20px; }
.totals div { display:flex; justify-content:space-between; padding:5px 0; color:var(--muted); font-variant-numeric:tabular-nums; }
.totals div.t { color:var(--fg); border-top:1px solid var(--line); margin-top:6px; padding-top:12px; }
.totals div.t b { font-family:var(--display); font-weight:500; font-size:24px; }
.tl { list-style:none; margin:0; padding:10px 22px 22px; }
.tl li { position:relative; padding:0 0 18px; padding-inline-start:24px; }
.tl li::before { content:''; position:absolute; inset-inline-start:3px; top:6px; width:7px; height:7px; border-radius:50%; background:var(--surface); border:1.5px solid var(--accent); }
.tl li::after { content:''; position:absolute; inset-inline-start:6.5px; top:17px; bottom:0; width:1px; background:var(--line); }
.tl li:last-child::after { display:none; }
.tl b { font-weight:500; display:block; } .tl small { color:var(--muted); font-size:11.5px; }

/* ---------- form ---------- */
.form { max-width:920px; }
.fs { display:grid; grid-template-columns:260px 1fr; gap:32px; padding:28px 0; border-bottom:1px solid var(--line); }
.fs h3 { font-family:var(--display); font-weight:500; font-size:22px; margin:0 0 6px; }
.fs p { margin:0; color:var(--muted); font-size:12.5px; }
.fg { display:grid; grid-template-columns:1fr 1fr; gap:18px 16px; }
.fg .full { grid-column:1/-1; }
.fa { display:flex; justify-content:flex-end; gap:8px; padding-top:22px; }

/* ---------- states / overlays ---------- */
.states { display:grid; grid-template-columns:1fr 1fr; gap:20px; padding:24px; }
.empty { text-align:center; padding:44px 24px; }
.empty .glyph { width:56px; height:56px; margin:0 auto 18px; border-radius:50%; display:grid; place-items:center; border:1px solid var(--line-strong); color:var(--accent-text); }
.empty .glyph .i { width:22px; height:22px; }
.empty h4 { font-family:var(--display); font-weight:500; font-size:24px; margin:0 0 6px; }
.empty p { color:var(--muted); margin:0 auto 20px; max-width:320px; }
.sk { height:12px; border-radius:3px; background:linear-gradient(90deg, var(--sunken), color-mix(in srgb, var(--sunken) 40%, var(--surface)), var(--sunken)); background-size:200% 100%; animation:sh 1.6s infinite linear; }
@keyframes sh { to { background-position:-200% 0; } }
@media (prefers-reduced-motion: reduce) { .sk { animation:none; } }
.skrow { display:grid; grid-template-columns:34px 1.2fr 2fr 1fr 1fr; gap:18px; align-items:center; padding:15px 18px; border-bottom:1px solid var(--line); }
.alert { display:flex; gap:12px; padding:14px 16px; border-radius:6px; border:1px solid color-mix(in srgb, var(--bad) 30%, transparent); background:color-mix(in srgb, var(--bad) 6%, var(--surface)); }
.alert .i { color:var(--bad); margin-top:2px; } .alert b { font-weight:500; display:block; } .alert p { margin:2px 0 8px; color:var(--muted); font-size:12.5px; }
.toast { display:flex; gap:12px; align-items:center; padding:13px 14px 13px 16px; border-radius:6px; background:var(--fg); color:var(--bg); box-shadow:0 20px 40px -18px rgba(0,0,0,.5); max-width:440px; }
.toast .ok { width:22px; height:22px; border-radius:50%; background:var(--accent); color:#1e1215; display:grid; place-items:center; flex:none; }
.toast .ok .i { width:12px; height:12px; stroke-width:2.2; }
.toast small { display:block; opacity:.65; font-size:11.5px; }
.toast .u { margin-inline-start:auto; font-weight:500; color:var(--accent); font-size:12.5px; }
.overlay { position:relative; min-height:460px; display:grid; place-items:center; background:var(--overlay); padding:30px 16px; }
.overlay::before { content:''; position:absolute; inset:0; background:repeating-linear-gradient(0deg, transparent 0 58px, rgba(255,255,255,.02) 58px 59px); }
.dialog { position:relative; width:min(460px,100%); background:var(--surface); border:1px solid var(--line); border-radius:8px; box-shadow:0 40px 80px -30px rgba(0,0,0,.55); padding:26px; }
.dialog h4 { font-family:var(--display); font-weight:500; font-size:26px; margin:0 0 8px; }
.dialog p { margin:0 0 22px; color:var(--muted); }
.cmd { position:relative; width:min(600px,100%); background:var(--surface); border:1px solid var(--line); border-radius:8px; box-shadow:0 40px 80px -30px rgba(0,0,0,.55); overflow:hidden; }
.cmd-in { display:flex; align-items:center; gap:12px; padding:0 18px; height:56px; border-bottom:1px solid var(--line); font-size:15px; }
.cmd-in .caret { width:1px; height:18px; background:var(--primary); margin-inline-start:-10px; }
.dark .cmd-in .caret { background:var(--accent); }
.cmd-g { padding:8px; }
.cmd-g .lbl { padding:8px 10px 6px; }
.cmd-g .row { display:flex; align-items:center; gap:12px; padding:9px 10px; border-radius:4px; color:var(--fg); }
.cmd-g .row .i { color:var(--muted); }
.cmd-g .row.on { background:color-mix(in srgb, var(--primary) 8%, transparent); }

  const bar = `<header class="bar"><div class="crumb">${L.crumb[0]}${ic('chev','flip')}<b>${L.crumb[1]}</b></div><div class="cmdk">${ic('search')}${L.cmdk}<kbd>⌘K</kbd></div><div class="ib">${ic('bell')}<i></i></div><span class="av">${L.me[0]}</span></header>`;
  const header = `<div class="ph"><div><div class="eyebrow">${L.eyebrow}</div><h1>${L.title}</h1><p>${L.desc}</p></div><div class="acts"><button class="btn">${ic('down')}${L.exp}</button><button class="btn p">${ic('plus')}${L.newInv}</button></div></div>
    <div class="stats">${L.stats.map(stat).join('')}</div>`;
  const table = `<div class="panel">
    <div class="fbar"><div class="in ph-t">${ic('search')}${L.q}</div>
      ${L.chips.map((c,i)=>`<span class="chip">${c[0]}: <b>${c[1]}</b>${ic(i?'x':'chevD')}</span>`).join('')}
      <span class="chip dash">${ic('plus')}${L.addF}</span><button class="btn g sm">${L.clear}</button><span class="cnt">${L.count}</span></div>
    <div class="tscroll"><table><thead><tr><th><span class="check on">${ic('check')}</span></th><th class="sorted">${L.th[0]}${ic('arrowD')}</th><th>${L.th[1]}</th><th>${L.th[2]}</th><th>${L.th[3]}</th><th>${L.th[4]}</th><th class="num">${L.th[5]}</th><th>${L.th[6]}</th><th></th></tr></thead>
    <tbody>${L.rows.map((r,i)=>`<tr class="${i==1||i==2?'sel':''}"><td><span class="check ${i==1||i==2?'on':''}">${i==1||i==2?ic('check'):''}</span></td><td class="ref">${r[0]}</td><td><div class="who"><span class="av">${r[1]}</span><div>${r[2]}<span class="sub2">${r[3]}</span></div></div></td><td class="mut">${r[4]}</td><td class="mut">${r[5]}</td><td>${r[6]}</td><td class="num">${r[7]}</td><td>${st(r[8],L.status[r[8]])}</td><td class="mut">${ic('more')}</td></tr>`).join('')}</tbody></table></div>
    <div class="pag"><span><b style="color:var(--fg);font-weight:500">${L.sel}</b> &nbsp;·&nbsp; <button class="btn sm">${ic('send')}${L.bulk[0]}</button> <button class="btn sm g">${L.bulk[1]}</button></span>
      <span>${L.showing}</span><div class="pages"><span>${ic('chev','flip')}</span><span class="on">1</span><span>2</span><span>3</span><span>…</span><span>42</span><span>${ic('chev')}</span></div></div></div>`;
  const legend = `<div class="panel legend">${Object.entries(L.legend).map(([k,v])=>st(k,v)).join('')}</div>`;
  const detail = `<div class="content">
    <div class="dh"><div><div class="eyebrow">${L.dEye}</div><h1>${L.dTitle} ${st('bad',L.dStatus)}</h1></div><div class="acts"><button class="btn ic">${ic('more')}</button><button class="btn">${ic('send')}${L.dActs[0]}</button><button class="btn p">${ic('card')}${L.dActs[1]}</button></div></div>
    <div class="facts">${L.facts.map((f,i)=>`<div><span class="lbl">${f[0]}</span><b class="${i>=4?'big':''}">${f[1]}</b></div>`).join('')}</div>
    <div class="tabs">${L.tabs.map((t,i)=>`<span class="${i==0?'on':''}">${t[0]}${t[1]?`<em>${t[1]}</em>`:''}</span>`).join('')}</div>
    <div class="dgrid"><div class="panel"><div class="ph2"><h3>${L.lines}</h3></div>
      <div class="tscroll"><table><thead><tr><th style="width:auto">${L.lth[0]}</th><th>${L.lth[1]}</th><th class="num">${L.lth[2]}</th><th class="num">${L.lth[3]}</th></tr></thead><tbody>${L.lrows.map(r=>`<tr><td style="width:auto">${r[0]}</td><td class="mut">${r[1]}</td><td class="num">${r[2]}</td><td class="num">${r[3]}</td></tr>`).join('')}</tbody></table></div>
      <div class="totals">${L.tot.map((t,i)=>`<div class="${i==2?'t':''}"><span>${t[0]}</span>${i==2?`<b>${t[1]}</b>`:`<span>${t[1]}</span>`}</div>`).join('')}</div></div>
    <div class="panel"><div class="ph2"><h3>${L.act}</h3></div><ul class="tl">${L.tl.map(t=>`<li><b>${t[0]}</b><small>${t[1]} · ${t[2]}</small></li>`).join('')}</ul></div></div></div>`;
  const F=L.f;
  const form = `<div class="content"><div class="form">
    <div class="ph"><div><div class="eyebrow">${L.fEye}</div><h1>${L.fTitle}</h1><p>${L.fDesc}</p></div></div>
    <div class="fs"><div><h3>${L.fs[0][0]}</h3><p>${L.fs[0][1]}</p></div><div class="fg">
      <div class="field full"><label>${F.tenant}</label><div class="in">${F.tenantV}<span class="end">${ic('updown')}</span></div></div>
      <div class="field full"><label>${F.unit}</label><div class="in focus">${F.unitV}<span class="end">${ic('updown')}</span></div><span class="help">${F.unitH}</span></div></div></div>
    <div class="fs"><div><h3>${L.fs[1][0]}</h3><p>${L.fs[1][1]}</p></div><div class="fg">
      <div class="field"><label>${F.start}</label><div class="in">${F.startV}<span class="end">${ic('cal')}</span></div></div>
      <div class="field"><label>${F.end}</label><div class="in">${F.endV}<span class="end">${ic('cal')}</span></div></div>
      <div class="field full"><label>${F.rent}</label><div class="in bad"><span class="aff">AED</span>${F.rentV}</div><span class="err">${ic('alert')}${F.rentE}</span></div>
      <div class="field full"><label>${F.freq}</label><div class="seg">${F.freqO.map((o,i)=>`<span class="${i==2?'on':''}">${o}</span>`).join('')}</div></div>
      <div class="field full"><label>${F.notes} <em>(${F.opt})</em></label><div class="in ta ph-t">${F.notesP}</div></div></div></div>
    <div class="fs"><div><h3>${L.fs[2][0]}</h3><p>${L.fs[2][1]}</p></div><div class="fg"><div class="switch full"><span class="sw-t"></span><div><b style="font-weight:500">${F.sw}</b><div class="help">${F.swH}</div></div></div></div></div>
    <div class="fa"><button class="btn g">${L.cancel}</button><button class="btn">${L.draft}</button><button class="btn p">${L.create}</button></div></div></div>`;
  const states = `<div class="states">
    <div class="panel empty"><div class="glyph">${ic('inbox')}</div><h4>${L.emptyT}</h4><p>${L.emptyP}</p><button class="btn p">${ic('plus')}${L.emptyB}</button></div>
    <div class="panel">${[0,1,2,3,4].map(i=>`<div class="skrow"><div class="sk" style="width:16px;height:16px"></div><div class="sk" style="width:${70-i*6}%"></div><div class="sk" style="width:${85-i*9}%"></div><div class="sk" style="width:60%"></div><div class="sk" style="width:${50+i*7}%"></div></div>`).join('')}</div>
    <div class="alert">${ic('alert')}<div><b>${L.errT}</b><p>${L.errP}</p><button class="btn sm">${L.retry}</button></div></div>
    <div style="display:flex;align-items:center"><div class="toast"><span class="ok">${ic('check')}</span><div>${L.toastT}<small>${L.toastP}</small></div><span class="u">${L.undo}</span></div></div></div>`;
  const cmd = `<div class="overlay"><div class="cmd"><div class="cmd-in">${ic('search')}<span>${L.cmdQ}</span><span class="caret"></span><kbd style="margin-inline-start:auto">esc</kbd></div>
    ${L.cmdG.map(([g,rows],gi)=>`<div class="cmd-g"><div class="lbl">${g}</div>${rows.map((r,i)=>`<div class="row ${gi==0&&i==0?'on':''}">${ic(r[0])}<span>${r[1]}</span><small>${r[2].length==1?`<kbd>${r[2]}</kbd>`:r[2]}</small></div>`).join('')}</div>`).join('')}
    <div class="cmd-f">${L.cmdF.map(f=>`<span>${f}</span>`).join('')}</div></div></div>`;
  const dlg = `<div class="overlay" style="min-height:340px"><div class="dialog"><h4>${L.dlgT}</h4><p>${L.dlgP}</p><div class="acts" style="justify-content:flex-end"><button class="btn">${L.dlgC}</button><button class="btn dd">${L.dlgD}</button></div></div></div>`;
  const b=L.bt;
  const btns = `<div class="btnset"><button class="btn p lg">${ic('plus')}${b[0]}</button><button class="btn p">${b[0]}</button><button class="btn p sm">${b[0]}</button></div>
    <div class="btnset"><button class="btn">${b[1]}</button><button class="btn g">${b[2]}</button><button class="btn d">${b[3]}</button><button class="btn dd">${b[3]}</button><button class="btn l">${b[4]}</button><button class="btn ic">${ic('more')}</button><button class="btn p" disabled>${b[5]}</button><button class="btn p focus">${b[6]}</button></div>`;

  const s=L.secs;
  document.getElementById('stage').innerHTML = `
   <div class="sec">${secH(s[0],'AppSidebar AppHeader Breadcrumbs')}${W(`<div class="shell">${side}<div class="main">${bar}<div class="content">${header}${table}</div></div></div>`)}</div>
   <div class="sec">${secH(s[1],'PageHeader StatTile')}${W(`<div class="content">${header}</div>`)}</div>
   <div class="sec">${secH(s[2],'FilterBar DataTable StatusDot Pagination')}${W(`<div class="content">${table}</div>`)}</div>
   <div class="sec">${secH(s[3],'StatusDot status-tones.ts')}${W(`<div class="content">${legend}</div>`)}</div>
   <div class="sec">${secH(s[4],'DetailLayout Money DateText')}${W(detail)}</div>
   <div class="sec">${secH(s[5],'FormSection FormField Input Select Switch')}${W(form)}</div>
   <div class="sec">${secH(s[6],'EmptyState LoadingState Alert Sonner')}${W(states)}</div>
   <div class="sec">${secH(s[7],'CommandPalette')}${W(cmd)}</div>
   <div class="sec">${secH(s[8],'ConfirmationModal')}${W(dlg)}</div>
   <div class="sec">${secH(s[9],'Button')}${W(`<div>${btns}</div>`)}</div>`;
}
function bind(id, set) {
  document.querySelectorAll(`#${id} button`).forEach(b => b.onclick = () => {
    document.querySelectorAll(`#${id} button`).forEach(x => x.classList.toggle('on', x===b)); set(b.dataset.v); render();
  });
}
bind('theme', v => theme=v); bind('lang', v => lang=v);
render();
</script>
</body>
</html>
