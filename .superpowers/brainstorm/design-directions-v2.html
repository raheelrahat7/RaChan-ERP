   hero:{t:'dark', eyebrow:'Z1 ERP', h:'Everything your portfolio does. One system.', p:'Leasing, finance, maintenance and CRM, engineered for property companies across the Gulf. Fast, precise and fully bilingual.', b1:'Book a demo', b2:'See how it works', nav:['Product','Modules','Customers','Pricing'] } },

 { id:'III', name:'Emerald Reserve', tag:'Jewel-tone luxury · Cartier · Harrods · Gulf heritage',
   why:'Deep emerald, ivory and antique gold: the colors of grand hotels, private members’ clubs and Gulf heritage brands. In light mode the navigation is a statement emerald rail against ivory content. Headings use a graceful high-contrast serif. The most distinctive and memorable of the three.',
   type:'Instrument Serif + Noto Naskh Arabic for display · Manrope + IBM Plex Sans Arabic for the interface',
   f:{ ui:"'Manrope','IBM Plex Sans Arabic',sans-serif", display:"'Instrument Serif','Noto Naskh Arabic',serif", num:"'Instrument Serif','Noto Naskh Arabic',serif", dw:400, nw:400, dls:'-0.01em', uls:'0', h1:'48px', h2:'24px', kpi:'42px', heroSize:'88px', r:'10px', rs:'7px', rbtn:'7px', rpill:'999px' },

/* ---------- renderers ---------- */
const vars = (d, t) => Object.entries({...d.f, ...t}).map(([k,v]) => `--${k}:${v}`).join(';');
let gid = 0;
const smooth = (pts) => pts.map((p,i) => i ? `C${(pts[i-1][0]+p[0])/2},${pts[i-1][1]} ${(pts[i-1][0]+p[0])/2},${p[1]} ${p[0]},${p[1]}` : `M${p[0]},${p[1]}`).join(' ');
function chart(L, t) {
  const data=[1.21,1.34,1.30,1.42,1.39,1.55,1.61,1.58,1.72,1.79,1.86,2.02], W=620, H=190, pad=22, id='g'+(++gid);
  const pts=data.map((v,i)=>[i*(W/(data.length-1)), pad+(1-(v-1.1)/1.0)*(H-2*pad)]);
  const line=smooth(pts), c = t.accent;
  const last=pts[pts.length-1];
  return `<svg class="chart" viewBox="0 -4 ${W} ${H+24}" preserveAspectRatio="none">
    <defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${c}" stop-opacity=".22"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></linearGradient></defs>
    ${[0.25,0.5,0.75].map(f=>`<line x1="0" x2="${W}" y1="${H*f}" y2="${H*f}" stroke="${t.line}" stroke-dasharray="2 4"/>`).join('')}
    <path d="${line} L${W},${H} L0,${H} Z" fill="url(#${id})"/>
    <path d="${line}" fill="none" stroke="${c}" stroke-width="1.6"/>
    <circle cx="${last[0]-3}" cy="${last[1]}" r="4" fill="${t.surface}" stroke="${c}" stroke-width="1.6"/>
    ${L.months.map((m,i)=>`<text x="${i*(W/11)+(i==0?4:i==11?-4:0)}" y="${H+18}" font-size="10.5" fill="${t.faint}" text-anchor="${i==0?'start':i==11?'end':'middle'}" font-family="inherit">${m}</text>`).join('')}
  </svg>`;
}
function spark(t, kind, seed) {
  const d=[[3,4,3.6,4.4,4.2,5,5.4,6],[2,2.6,2.4,3.2,3.4,4.1,4.3,5],[3,3.4,3.1,4,4.6,4.4,5.2,5.6],[4,3.6,4.4,4.1,5,4.8,5.6,6]][seed];
  const pts=d.map((v,i)=>[i*12, 22-(v-2)*4.5]);
  return `<svg width="86" height="24" viewBox="0 0 86 24"><path d="${smooth(pts)}" fill="none" stroke="${kind=='up'?t.ok:t.bad}" stroke-width="1.3" opacity=".85"/></svg>`;
}
const tone = (t, k) => ({ok:t.ok,warn:t.warn,bad:t.bad,accent:t.accent,muted:t.faint})[k];

function app(d, t, L) {
  return `<div class="app" dir="${L.dir}" style="${vars(d,t)}">
  <aside class="side">
    <div class="brand"><span class="mark">Z1</span><div><b>Z1</b><small>${L.org}</small></div></div>
    ${L.groups.map(([g,items])=>`<div class="grp">${g}</div>${items.map(([i,n,on])=>`<div class="item${on?' on':''}">${ic(i)}<span>${n}</span></div>`).join('')}`).join('')}
    <div class="me"><span class="av">${L.me[0]}</span><div>${L.me[1]}<small>${L.me[2]}</small></div></div>
  </aside>
  <div class="main">
    <header class="bar"><div class="crumb">${L.crumb[0]}<span>/</span><b>${L.crumb[1]}</b></div>
      <div class="search">${ic('search')}${L.search}<kbd>⌘K</kbd></div><div class="iconbtn">${ic('bell')}<i></i></div></header>
    <div class="content">
      <div class="greet"><div><div class="eyebrow">${L.eyebrow}</div><h1>${L.hello}</h1></div>
        <div class="actions"><button class="btn">${ic('down')}${L.b1}</button><button class="btn p">${ic('plus')}${L.b2}</button></div></div>
      <div class="kpis">${L.kpis.map((k,i)=>`<div class="kpi"><div class="k-label">${k[0]}</div>
        <div class="k-val">${k[1]?`<span class="pre">${k[1]}</span>`:''}${k[2]}<small>${k[3]}</small></div>
        <div class="k-foot"><span class="${k[5]}">${k[4]}</span>${spark(t,k[5],i)}</div></div>`).join('')}</div>
      <div class="cols">
        <section class="panel"><div class="p-head"><h2>${L.chartT}</h2><div class="seg"><span>${L.seg[0]}</span><span class="on">${L.seg[1]}</span></div></div>
          <div class="big">${L.big}<span>${L.bigS}</span></div>${chart(L,t)}</section>
        <section class="panel attn"><div class="p-head"><h2>${L.attnT}</h2><a href="#" onclick="return false">${L.all}</a></div>
          <ul>${L.attn.map(a=>`<li><span class="dot" style="background:${tone(t,a[0])}"></span><div><b>${a[1]}</b><small>${a[2]}</small></div><time>${a[3]}</time></li>`).join('')}</ul></section>
      </div>
      <section class="panel"><div class="p-head"><h2>${L.tableT}</h2><a href="#" onclick="return false">${L.all}</a></div>
        <table><thead><tr><th>${L.th[0]}</th><th>${L.th[1]}</th><th>${L.th[2]}</th><th class="num">${L.th[3]}</th><th>${L.th[4]}</th></tr></thead>
        <tbody>${L.rows.map(r=>`<tr><td class="unit">${r[0]}</td><td><div class="who"><span class="av">${r[1]}</span>${r[2]}</div></td><td style="color:${t.muted}">${r[3]}</td><td class="num">${r[4]}</td><td><span class="status"><i style="background:${tone(t,r[5])}"></i>${r[6]}</span></td></tr>`).join('')}</tbody></table></section>
    </div>
  </div></div>`;
}

function hero(d) {
  const h=d.hero, t=d[h.t];
  return `<div class="hero" dir="ltr" style="${vars(d,t)}"><div class="glow"></div>
    <nav class="h-nav"><span class="bt"><span class="mark" style="border-color:${t.line}">Z1</span>Z1</span>${h.nav.map(n=>`<a>${n}</a>`).join('')}<a>العربية</a><button class="btn p">${h.b1.split(' ').slice(0,2).join(' ')}</button></nav>
    <div class="h-body"><div class="eyebrow">${h.eyebrow}</div><h1>${h.h}</h1><p>${h.p}</p>
      <button class="btn p">${h.b1}</button>&nbsp;&nbsp;<button class="btn">${h.b2}</button></div>
    <div class="h-shot">${EN.kpis.slice(0,3).map((k,i)=>`<div class="kpi"><div class="k-label">${k[0]}</div><div class="k-val">${k[1]?`<span class="pre">${k[1]}</span>`:''}${k[2]}<small>${k[3]}</small></div><div class="k-foot"><span class="${k[5]}">${k[4]}</span>${spark(t,k[5],i)}</div></div>`).join('')}</div>
  </div>`;
}

document.getElementById('dirs').innerHTML = DIRS.map(d => `
<section class="dir" data-dir="${d.id}">
  <div class="dir-top">
    <div><div class="n">Direction ${d.id} · ${d.tag}</div><h2>${d.name}</h2><p>${d.why}</p><p class="type"><b>Type:</b> ${d.type}</p></div>
    <div class="tabs">${['Light','Dark','Arabic','Website'].map((n,i)=>`<button class="${i==0?'on':''}" data-i="${i}">${n}</button>`).join('')}</div>
  </div>
  <div class="pane on">${app(d,d.light,EN)}</div>
  <div class="pane">${app(d,d.dark,EN)}</div>
  <div class="pane">${app(d,d.light,AR)}</div>
  <div class="pane">${hero(d)}</div>
</section>`).join('');

document.querySelectorAll('.dir').forEach(sec => {
  const btns = sec.querySelectorAll('.tabs button'), panes = sec.querySelectorAll('.pane');
  btns.forEach(b => b.addEventListener('click', () => {
    btns.forEach(x => x.classList.toggle('on', x === b));
    panes.forEach((p, i) => p.classList.toggle('on', i == b.dataset.i));
  }));
});
</script>
</body>
</html>
